name: CI/CD Pipeline - Chickie Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Containers
        run: |
          echo "Starting Docker Compose Build..."
          docker compose build

      - name: Deploy Containers with Zero-Downtime Migration
        run: |
          echo "Starting Docker Compose Up..."
          docker compose up -d --remove-orphans

      - name: Health Check Services
        run: |
          echo "Waiting 10 seconds for services to stabilize..."
          sleep 10
          
          echo "Checking Client (port 3100)..."
          curl --fail -s http://localhost:3100 > /dev/null || (echo "Client healthcheck failed" && exit 1)
          
          echo "Checking CRM (port 3101)..."
          curl --fail -s http://localhost:3101 > /dev/null || (echo "CRM healthcheck failed" && exit 1)
          
          echo "Checking Server API (port 8180)..."
          curl -s -X POST http://localhost:8180/api/public/auth/login -H "Content-Type: application/json" -d '{"username":"hc","password":"123"}' > /dev/null || (echo "API healthcheck failed" && exit 1)
          
          echo "All services are up and healthy!"

      - name: Clean up unused Docker images
        if: always()
        run: |
          docker image prune -f || true
