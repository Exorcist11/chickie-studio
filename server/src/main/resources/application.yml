server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: chickie-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chickie_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dngngx2077@gmail.com}
    password: ${MAIL_PASSWORD:murthzgtyhkttooc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: false

chickie:
  jwt:
    secret: ${JWT_SECRET:4c6869636b696553747564696f5365637265744b657932303236466f724a575441757468656e7469636174696f6e546f6b656e}
    access-token-expiration-ms: 900000       # 15 phút
    refresh-token-expiration-ms: 604800000   # 7 ngày
  mail:
    from-email: ${MAIL_FROM:dngngx2077@gmail.com}
    from-name: ${MAIL_FROM_NAME:Chickie Studio}
    enabled: ${MAIL_ENABLED:true}
  upload:
    dir: ${CHICKIE_UPLOAD_DIR:uploads}
